# Application Configuration
spring.application.name=KPOK2

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/kpok2_db
spring.datasource.username=kpok2
spring.datasource.password=kpok2
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

# Server Configuration
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080

# REST API security. With no token configured, every API request is rejected.
app.api.security.token=${KPOK2_API_TOKEN:}
app.api.import.max-bytes=${KPOK2_API_IMPORT_MAX_BYTES:26214400}

# Logging Configuration
logging.level.com.myprojects.kpok2=DEBUG
logging.level.org.springframework.web=INFO

spring.profiles.active=local

# Debug settings
app.debug.save-files=${KPOK2_DEBUG_SAVE_FILES:false}
app.debug.output-dir=debug_output
app.debug.html-dir=html
app.debug.screenshots-dir=screenshots

application.version=1.0.0

#######################
# UI Configuration
#######################
ui.window.width=800
ui.window.height=600
ui.window.title=KPOK2

# Localization
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=true

# Optional initial quiz selection. It can also be changed in Navigation Settings.
testcenter.navigation.quiz-url=${TESTCENTER_QUIZ_URL:}
testcenter.navigation.account-acquire-timeout-seconds=${TESTCENTER_ACCOUNT_ACQUIRE_TIMEOUT_SECONDS:10}
testcenter.navigation.max-consecutive-failures=${TESTCENTER_MAX_CONSECUTIVE_FAILURES:3}
testcenter.navigation.failure-retry-delay-seconds=${TESTCENTER_FAILURE_RETRY_DELAY_SECONDS:5}
