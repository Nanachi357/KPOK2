services:
  app:
    build: .
    container_name: kpok2_app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kpok2_db
      SPRING_DATASOURCE_USERNAME: kpok2
      SPRING_DATASOURCE_PASSWORD: kpok2
      # Listen on the container network; the published port remains host-local.
      SERVER_ADDRESS: 0.0.0.0
      KPOK2_API_TOKEN: ${KPOK2_API_TOKEN:-}
      KPOK2_API_IMPORT_MAX_BYTES: ${KPOK2_API_IMPORT_MAX_BYTES:-26214400}
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:18
    container_name: kpok2_postgres
    environment:
      POSTGRES_DB: kpok2_db
      POSTGRES_USER: kpok2
      POSTGRES_PASSWORD: kpok2
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
